# CI. Mirrors `make check` so a green local run means a green PR.
#
# Jobs are split by concern rather than by service: with several agents
# merging small PRs concurrently, a single monolithic job means everyone waits
# on everyone else's compile time.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  # Fast feedback: formatting and vet before anyone waits on tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}
      - run: go build ./...
      # -race is mandatory: this system runs a keyed worker pool and a
      # scheduler polling concurrently, so a suite that only passes serially
      # is hiding a real bug (docs/ENGINEERING.md section 1).
      - run: go test -race ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # buf breaking needs history to compare
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}
      - name: install pinned proto tooling
        run: make tools
      - name: lint
        run: make proto-lint
      # Mechanically enforces the proto-PR-first rule: a backwards
      # incompatible change fails here rather than surprising another agent
      # mid-branch (docs/ARCHITECTURE.md section 9).
      #
      # Compares against the LOCAL origin/main ref (via `make proto-breaking`,
      # the same target contributors run before pushing), not a fresh remote
      # clone. This is a private repo, so an anonymous HTTPS clone of
      # "https://github.com/<repo>.git" 404s on the username prompt and fails
      # every PR regardless of the diff; fetch-depth: 0 above already gives us
      # full history for every branch, including origin/main, so there is no
      # need to clone anything. See docs/INCIDENTS.md.
      - name: breaking-change check
        if: github.event_name == 'pull_request'
        run: make proto-breaking
      # A service PR must never carry generated-code changes. If regenerating
      # produces a diff, either gen/ is stale or this PR edited protos without
      # being a proto PR. Both need splitting.
      - name: generated code is up to date
        run: |
          cd proto && buf generate && cd ..
          if ! git diff --quiet -- proto/gen; then
            echo "::error::proto/gen is stale or this PR mixes proto and service changes."
            git diff --stat -- proto/gen; exit 1
          fi

  # Proves each service image actually builds, and that its Dockerfile
  # respects the repo-root build context (docs/ARCHITECTURE.md section 2a).
  # Which images actually need rebuilding, so a docs-only change does not
  # rebuild nine Go binaries (AGENTS.md, "Branching and CI conventions").
  # The logic lives in a script rather than inline YAML so it can be run and
  # tested locally instead of only by pushing and hoping.
  # web/ had no CI at all until 2026-09-01: no typecheck, no build, no tests,
  # ever. The vitest suite added with the records-pagination fix would have
  # sat there never running, which is the same shape as the 2026-08-23
  # incident where the e2e suite silently executed nothing behind a tag
  # mismatch. A job whose test count is zero looks identical to one that
  # passed.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the version web/package-lock.json was generated with.
          # Node 20 ships npm 10, which resolves esbuild's optional
          # platform packages differently and rejects this lockfile with
          # "Missing: @esbuild/win32-x64@0.28.2 from lock file". Pinning the
          # major here rather than loosening npm ci to npm install keeps the
          # lockfile authoritative, which is the whole point of running it.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  changed:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # the script needs the diff base in history
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/changed-services.sh

  docker:
    needs: changed
    # Skipped entirely when nothing that reaches an image changed. Note this
    # is a skip, not a failure: with no required-checks protection on this
    # repo a skipped job cannot block a merge.
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changed.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .                                  # repo root, by design
          file: ${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The end-to-end test needs the full stack up, so it runs on merge rather
  # than on every PR (docs/AGENTS.md testing conventions).
  # Runs on PRs as well as merges. The infra-dependent tests now sit behind
  # build tags, so if this only ran on merge a PR could go green without any
  # of them executing. Container startup is ~30s, cheap for that coverage.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}
      - name: start infra
        run: docker compose up -d --wait
      - name: migrate
        env:
          POSTGRES_DSN: postgres://momotaro:momotaro@localhost:5432/momotaro?sslmode=disable
        run: make migrate-up
      - name: integration tests
        env:
          POSTGRES_DSN: postgres://momotaro:momotaro@localhost:5432/momotaro?sslmode=disable
          REDIS_ADDR: localhost:6379
          KAFKA_BROKERS: localhost:9092
        # Run in two passes rather than one `./...`, because the two
        # cannot safely share a database concurrently.
        #
        # test/e2e starts the REAL decision-engine as a subprocess, and its
        # scheduler calls claimDue, which selects any record whose due_at
        # has passed with no batch or record filter (store.go). That is
        # correct for the real service and must not be narrowed to suit
        # tests. But `go test ./...` runs packages in parallel, so e2e's
        # live scheduler and services/decision-engine/internal/engine's
        # integration tests raced for the same rows: whichever ticked first
        # claimed the other's records, and the loser failed with
        # "executor called 0 times" or "Execute was never called". That is
        # the flake logged in docs/INCIDENTS.md 2026-09-01, which reached
        # main on 2026-09-02.
        #
        # Pass 1 excludes test/e2e, so no live scheduler is running while
        # the engine tests drive their own. Pass 2 runs test/e2e alone.
        # Only these two are serialised; every other package still runs in
        # parallel, unlike -p 1.
        #
        # Both tags still appear: `integration` covers the tests that need
        # Postgres/Kafka, `e2e` covers test/e2e. Naming only one silently
        # skips the other, so pass 2 asserts it actually ran tests rather
        # than reporting a vacuous pass (docs/INCIDENTS.md 2026-08-23, where
        # a tag mismatch made the e2e job execute nothing and still go
        # green).
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration $(go list ./... | grep -v '/test/e2e')
          go test -race -count=1 -tags=e2e -v ./test/e2e/... 2>&1 | tee /tmp/e2e.log
          grep -q '^=== RUN' /tmp/e2e.log || {
            echo "e2e pass executed no tests, the e2e build tag is not matching"
            exit 1
          }
      - name: infra logs on failure
        if: failure()
        run: docker compose logs --tail=100
