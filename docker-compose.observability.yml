# Optional local-dev observability stack (docs/PHASE4_IMPLEMENTATION.md
# Units C and D). Kept out of docker-compose.yml deliberately: that file
# backs `make up`, which `make test-integration` also depends on, and
# integration tests assert nothing about metrics or alerts, so there is no
# reason for every CI integration run to also pull and start these.
#
#   make up-observability   start the base stack plus Prometheus + Alertmanager
#   make down                stop everything, base stack included
#
# App services are not containers on this network (docker-compose.yml's own
# header comment: they run from your IDE, or as images built per service),
# so Prometheus reaches them via host.docker.internal at the fixed ports
# `make run-<service>` binds them to (docs/DECISIONS.md).
name: momotaro

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    extra_hosts:
      # Portable across Docker Desktop (already resolves this) and native
      # Linux Docker Engine 20.10+ (needs this mapping spelled out).
      - "host.docker.internal:host-gateway"
    # Host port 9900, not 9090: 9090 is ingestion's GRPC_PORT on this same
    # host (docs/DECISIONS.md), and the container's own internal port stays
    # Prometheus's normal default.
    ports: ["9900:9090"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    # Host port 9901: 9900 is Prometheus's own UI on this same host.
    ports: ["9901:9093"]
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
