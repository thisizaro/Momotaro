# Optional local-dev observability stack (docs/PHASE4_IMPLEMENTATION.md
# Units C, D and E). Kept out of docker-compose.yml deliberately: that file
# backs `make up`, which `make test-integration` also depends on, and
# integration tests assert nothing about metrics, alerts, or dashboards, so
# there is no reason for every CI integration run to also pull and start
# these.
#
#   make up-observability   start the base stack plus Prometheus/Alertmanager/Grafana
#   make down                stop everything, base stack included
#
# App services are not containers on this network (docker-compose.yml's own
# header comment: they run from your IDE, or as images built per service),
# so Prometheus reaches them via host.docker.internal at the fixed ports
# `make run-<service>` binds them to (docs/DECISIONS.md).
name: momotaro

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    extra_hosts:
      # Portable across Docker Desktop (already resolves this) and native
      # Linux Docker Engine 20.10+ (needs this mapping spelled out).
      - "host.docker.internal:host-gateway"
    # Host port 9900, not 9090: 9090 is ingestion's GRPC_PORT on this same
    # host (docs/DECISIONS.md), and the container's own internal port stays
    # Prometheus's normal default.
    ports: ["9900:9090"]
    volumes:
      # Rendered by `make up-observability` from prometheus.yml.tmpl, not
      # checked in (docs/DECISIONS.md): the scrape targets need the actual
      # HOST_IP for this machine, not a value frozen at commit time.
      - ./deploy/observability/prometheus.generated.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    # Host port 9901: 9900 is Prometheus's own UI on this same host.
    ports: ["9901:9093"]
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    # Host port 9902: 9900/9901 are Prometheus/Alertmanager on this same host.
    ports: ["9902:3000"]
    environment:
      # Static demo login, same spirit as API_KEY in .env.example (PRD.md
      # section 17): zero setup for a judge, not meant as real auth.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: momotaro
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    # One mount, not two: a second volume mounted at a path inside this one
    # would need Docker to create a mountpoint inside an already-mounted
    # read-only tree, which fails outright (docs/INCIDENTS.md 2026-08-29).
    # Dashboard JSON lives under provisioning/dashboards/files instead.
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
