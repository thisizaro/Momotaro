syntax = "proto3";

// The Decision Engine is primarily a Kafka consumer, not a gRPC server: work
// arrives on raw.events. It exposes gRPC only for outcomes that arrive
// asynchronously, after the request that started them has already returned.
//
// In this repo that caller is the World Simulator's delayed-outcome queue.
// In a real deployment it would be a bank's async webhook landing on the same
// RPC. See docs/ARCHITECTURE.md sections 6, 7a.
package momotaro.decisionengine.v1;

import "common/v1/common.proto";

option go_package = "github.com/thisizaro/Momotaro/proto/gen/decisionengine/v1;decisionenginev1";

service DecisionEngineService {
  // Resume a record parked in a waiting state because its outcome resolved
  // later (a customer acting on a nudge hours after receiving it).
  rpc ReportDelayedOutcome(ReportDelayedOutcomeRequest) returns (ReportDelayedOutcomeResponse);

  // Records one Razorpay payment.downtime.started / .updated / .resolved
  // webhook (docs/PHASE5_5_IMPLEMENTATION.md Unit Y), exactly the kind of
  // "arrives after the fact, with no request left to answer on" event this
  // file's header comment describes: a bank outage starting or clearing is
  // not something the Decision Engine ever asks about, it is told. The API
  // Gateway (POST /v1/webhooks/payment-downtime) is the only caller, the
  // same shape as a real Razorpay webhook landing on this RPC in production.
  rpc ReportDowntimeEvent(ReportDowntimeEventRequest) returns (ReportDowntimeEventResponse);

  // Returns the guardrail and LLM-routing values this service loaded and
  // validated at startup (docs/DEMO_READINESS.md Unit AM), so the API
  // Gateway's GET /v1/demo/config can proxy them instead of re-reading
  // os.Getenv independently, which risks drifting from what is actually
  // enforced if either copy's parsing or defaulting ever changes
  // (docs/INCIDENTS.md 2026-09-03: this project has hit config drift
  // between two copies of the same setting three times already). Every
  // value returned here is fixed for the lifetime of the process: none of
  // it is adjustable through this RPC or any other, it is read-only by
  // construction, not merely by convention.
  rpc GetAgentConfig(GetAgentConfigRequest) returns (GetAgentConfigResponse);
}

message ReportDelayedOutcomeRequest {
  string record_id = 1;
  // Identifies WHICH attempt resolved. Required: without it a late-arriving
  // outcome could be applied to the wrong attempt after a re-score.
  int32 attempt_number = 2;
  common.v1.Outcome outcome = 3;
  string failure_code = 4;
}

message ReportDelayedOutcomeResponse {
  // False when the outcome was discarded, e.g. the record already reached a
  // terminal state. Discarding is normal, not an error: this RPC is
  // at-least-once like everything else here.
  bool applied = 1;
  common.v1.RecordState resulting_state = 2;
}

// ReportDowntimeEventRequest is already translated from Razorpay's raw wire
// shape (docs/PHASE5_5_IMPLEMENTATION.md Unit Y: the payload nests three
// levels deep and Razorpay's own `instrument` object varies by payment
// method). The API Gateway does that translation once, at the edge, so
// nothing on this side of the RPC needs to know Razorpay's per-method
// shapes: instrument_key is already the single identifying value extracted
// from whichever fields `instrument_schema` named (e.g. "VIJB" for
// netbanking's {"bank":"VIJB"}, "SBIN" for a card's
// {"issuer":"SBIN","type":"credit"}).
message ReportDowntimeEventRequest {
  string downtime_id = 1;    // Razorpay's down_xxx id, the upsert key
  string method = 2;         // e.g. "netbanking", "card", "upi", exactly as Razorpay sent it
  string status = 3;         // "started" | "updated" | "resolved"
  bool scheduled = 4;        // planned maintenance vs an unplanned outage
  string severity = 5;       // "high" | "medium" in Razorpay's documented examples; treated as an open string, never validated against a closed list
  string instrument_key = 6; // the single identifying value pulled from Razorpay's `instrument` object
  int64 begin_unix = 7;      // UNIX SECONDS, not milliseconds
  int64 end_unix = 8;        // UNIX SECONDS; meaningless unless has_end is true
  bool has_end = 9;          // false while the downtime is ongoing (Razorpay's own `end: null` shape)
}

message ReportDowntimeEventResponse {
  bool applied = 1;
}

// GetAgentConfigRequest takes no arguments: this always returns the one
// config this process loaded at startup, never a per-caller view of it.
message GetAgentConfigRequest {}

// GetAgentConfigResponse is the behavioral subset of this service's config
// worth showing on the Demo Controls page (docs/DEMO_READINESS.md Unit AM):
// timings, limits and thresholds, never a secret or a connection string.
// Every duration is whole seconds, matching this file's own begin_unix/
// end_unix convention of plain integers over google.protobuf.Duration.
//
// LLM_PROVIDER_CHAIN is deliberately absent: it belongs to the Classifier,
// not this service, and reaching it from here would mean either a second
// cross-service call or a duplicated copy of the Classifier's own parsing,
// which is exactly the kind of drift this RPC exists to avoid causing
// elsewhere. See docs/DECISIONS.md.
message GetAgentConfigResponse {
  // demo_time_scale is DEMO_TIME_SCALE (internal/platform/config), loaded
  // identically by every service in this repo.
  double demo_time_scale = 1;
  // Guardrails, docs/PRD.md section 11 (engine.GuardrailConfig).
  int32 max_retries = 2;
  int32 max_contacts = 3;
  int64 contact_cooldown_seconds = 4;
  int64 recovery_window_seconds = 5;
  // LLM routing, this service's own config (services/decision-engine/cmd/main.go).
  double llm_sample_rate = 6;
  double route_confidence_threshold = 7;
  double classify_confidence_threshold = 8;
  int32 nudge_max_chars = 9;
  // downtime_max_unresolved_hold_seconds is engine.DowntimeMaxUnresolvedHold:
  // a Go constant, not an env var, but a real bound the agent operates
  // under, so it is included even though it has no environment variable
  // backing it.
  int64 downtime_max_unresolved_hold_seconds = 10;
}
